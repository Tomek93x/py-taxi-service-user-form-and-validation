{% extends "base.html" %}

{% block content %}
  <h1>
    {{ car.model }}
    <a href="{% url 'taxi:car-delete' pk=car.id %}" class="btn btn-danger link-to-page">
      Delete
    </a>
    <a href="{% url 'taxi:car-update' pk=car.id %}" class="btn btn-secondary link-to-page">
      Update
    </a>
  </h1>
  <p>Manufacturer: ({{ car.manufacturer.name }}, {{ car.manufacturer.country }})</p>

  {# Przyciski assign/delete me #}
  <div class="mb-3">
    {% if is_driver %}
      <form method="post" action="{% url 'taxi:car-delete-me' pk=car.id %}" style="display:inline;">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-danger">Delete me from this car</button>
      </form>
    {% else %}
      <form method="post" action="{% url 'taxi:car-assign-me' pk=car.id %}" style="display:inline;">
        {% csrf_token %}
